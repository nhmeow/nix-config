# config ref: https://starship.rs/config/

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = """$directory[<](dimmed white)[V](#5b99ff)[>](dimmed white) $all"""
continuation_prompt = '[⊢](#888888) '

command_timeout = 3000

# Inserts a blank line between shell prompts
add_newline = true

# Replace the '❯' symbol in the prompt with '𝞅'
[character]
success_symbol = '[𝞅](#F18D00)' # φ (greek small letter phi)
error_symbol = '[F](bold red)'

[username]
show_always = true
format = '[$user]($style) '
